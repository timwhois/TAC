name: Import approved portfolio image
on:
  push:
    paths:
      - '.github/workflows/import-sample-concept.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site
          persist-credentials: true
      - name: Download approved image into site assets
        run: |
          mkdir -p public/portfolio
          curl --fail --location --silent --show-error --retry 3 'https://cdn.shopify.com/s/files/1/1009/5824/1142/files/third-axis-sample-management-concept.png?v=1792755509' -o public/portfolio/sample-system-concept.png
          echo 'd85fa46bbd0b10d25e2b170504e9703abb9c171dc56cad3495861e6985371548  public/portfolio/sample-system-concept.png' | sha256sum --check
      - name: Commit image to website repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/portfolio/sample-system-concept.png
          git commit -m 'Store approved sample system concept image in site assets'
          git push origin HEAD:site
