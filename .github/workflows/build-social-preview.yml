name: Build static social preview

on:
  push:
    branches:
      - redesign/unified-family-2026-10-23
    paths:
      - .github/workflows/build-social-preview.yml
      - scripts/generate_social_preview.py
      - public/portfolio/wow-factor-placeholder.png
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependency
        run: python -m pip install Pillow==11.3.0
      - name: Render 1200x630 social card
        run: python scripts/generate_social_preview.py --brand thirdaxis --source public/portfolio/wow-factor-placeholder.png --out public/social-preview.jpg
      - name: Commit static JPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/social-preview.jpg
          if git diff --cached --quiet; then
            echo "Social card already up to date"
            exit 0
          fi
          git commit -m "Generate updated branded social-preview JPG"
          git push origin HEAD:refs/heads/redesign/unified-family-2026-10-23
