    <script>
      /* Independent section navigation, intentionally not tied to React hydration. */
      (() => {
        if (matchMedia("(prefers-reduced-motion: reduce), (max-width: 700px)").matches) return;
        let busy = false;
        let unlockTimer;
        let scrollTimer;
        let accumulated = 0;
        let lastDirection = 1;
        const navHeight = () => document.querySelector("header.nav")?.getBoundingClientRect().height || 82;
        const anchors = () => {
          const y = window.scrollY;
          return [...document.querySelectorAll(".axis-film-panel, main > section:not(.axis-film)")].map((element, index) => {
            const rect = element.getBoundingClientRect();
            return { element, top: index === 0 ? 0 : Math.max(0, Math.round(y + rect.top - navHeight())), height: rect.height };
          });
        };
        const move = (top) => {
          if (Math.abs(window.scrollY - top) < 4) return;
          busy = true;
          clearTimeout(scrollTimer);
          clearTimeout(unlockTimer);
          window.scrollTo({ top, behavior: "smooth" });
          unlockTimer = setTimeout(() => { busy = false; }, 850);
        };
        const inLongSection = (items, y, direction) => {
          const vh = innerHeight - navHeight();
          const item = [...items].reverse().find(x => x.top <= y + 10);
          if (!item || item.height <= vh + 90) return false;
          return direction > 0
            ? y < item.top + item.height - vh - 25
            : y > item.top + 25;
        };
        const wheel = (e) => {
          if (e.ctrlKey || e.altKey || e.shiftKey || Math.abs(e.deltaY) < 2 ||
              e.target.closest("dialog, textarea, select, [role=dialog], [data-no-snap]")) return;
          if (busy) { e.preventDefault(); return; }
          const direction = Math.sign(e.deltaY);
          lastDirection = direction;
          const items = anchors();
          if (!items.length) return;
          const y = window.scrollY;
          if (inLongSection(items, y, direction)) return;
          accumulated += e.deltaY;
          if (Math.abs(accumulated) < 18) { e.preventDefault(); return; }
          accumulated = 0;
          const nearestIndex = items.reduce((best, item, i) =>
            Math.abs(item.top - y) < Math.abs(items[best].top - y) ? i : best, 0);
          const atAnchor = Math.abs(items[nearestIndex].top - y) < 65;
          const next = atAnchor ? nearestIndex + direction :
            (direction > 0
              ? items.findIndex(item => item.top > y + 10)
              : items.findLastIndex(item => item.top < y - 10));
          if (next < 0 || next >= items.length) return;
          e.preventDefault();
          move(items[next].top);
        };
        const settle = () => {
          if (busy) return;
          const items = anchors();
          const y = window.scrollY;
          if (!items.length || inLongSection(items, y, lastDirection)) return;
          const nearest = items.reduce((best, item) =>
            Math.abs(item.top - y) < Math.abs(best.top - y) ? item : best);
          move(nearest.top);
        };
        addEventListener("wheel", wheel, { passive:false });
        addEventListener("scroll", () => {
          if (busy) return;
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(settle, 160);
        }, { passive:true });
      })();
    </script>
